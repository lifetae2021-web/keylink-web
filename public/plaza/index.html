<style>

  .chat-input button { border:none; background:var(--accent); color:#fff; font-family:inherit; font-size:.95rem; padding:0 18px; border-radius:12px; cursor:pointer; }
  [hidden] { display:none !important; }

<body>
<canvas id="c"></canvas>
<div id="hud" hidden>
  <div class="panel"><h1 id="hudNick">키링크 광장</h1><p id="hudHelp">WASD·조이스틱 이동 · 마우스로 시야 · 스페이스 점프 · 사람 클릭</p></div>
  <div id="net"><span class="dot off" id="netDot"></span><span id="netTxt">연결 중…</span></div>
  <div id="stick"><div id="knob"></div><div class="hint">드래그해서 이동</div></div>
  <button id="jumpBtn" aria-label="점프">점프</button>
  <div id="reticle" hidden></div>
</div>
<div id="entry"><div id="sheet">
  <h2>캐릭터 만들기</h2>
  <div class="row"><label for="nick">닉네임</label><input id="nick" maxlength="8" placeholder="2~8자" autocomplete="off"><div id="nickLockHint" class="nick-hint" hidden></div></div>
  <div class="row"><label>성별</label><div class="opts" id="opt-gender"></div></div>
  <div class="row"><label>얼굴형</label><div class="opts" id="opt-face"></div></div>
  <div class="row"><label>머리 모양</label><div class="opts" id="opt-hair"></div></div>
  <div class="row"><label>머리 색</label><div class="opts" id="opt-hairColor"></div></div>
  <div class="row"><label>눈</label><div class="opts" id="opt-eye"></div></div>
  <div class="row"><label>옷 색</label><div class="opts" id="opt-clothes"></div></div>
  <div class="row"><label>지역</label><div class="opts" id="opt-region"></div></div>
  <div class="row"><label for="birth">출생연도</label><input id="birth" inputmode="numeric" maxlength="4" placeholder="예) 1996" autocomplete="off"></div>
  <div class="row"><label for="job">직업</label><input id="job" maxlength="20" placeholder="예) 디자이너" autocomplete="off"></div>
  <div class="row"><label for="intro">한 줄 소개</label><input id="intro" maxlength="40" placeholder="예) 커피랑 산책 좋아해요" autocomplete="off"></div>
  <div class="sheet-btns"><button class="btn ghost" id="randomBtn">🎲 랜덤</button><button class="btn go" id="enterBtn">입장하기</button></div>
</div></div>
<div id="card" hidden><div class="card-box">
  <button id="cardClose" class="card-x" aria-label="닫기">✕</button>
  <div class="card-name" id="cardName"></div><div class="card-meta" id="cardMeta"></div>
  <button id="cardReq" class="btn go">💌 1:1 대화 신청</button>
  <div class="safety-row" id="cardSafety"><button type="button" id="cardReport">🚨 신고</button><button type="button" id="cardBlock">🚫 차단</button></div>
</div></div>
<div id="join" hidden><div class="card-box">
  <button id="joinClose" class="card-x" aria-label="닫기">✕</button>
  <div class="card-name" id="joinTitle">회원가입하고 계속하기</div>
  <div class="card-meta" id="joinMeta">다른 분 정보 보기·1:1 대화는 회원만 가능해요</div>
  <div class="join-sum" id="joinSum"></div>
  <div class="join-note" id="joinNote">카카오로 1초면 끝나요. 생년월일·연락처는 가입할 때 입력해요.</div>
  <button class="btn kakao" id="joinKakao">💬 카카오로 1초만에 시작하기</button>
</div></div>
<div id="req" hidden><span id="reqTxt"></span><button class="yes" id="reqYes">수락</button><button class="no" id="reqNo">나중에</button></div>
<div id="report" hidden><div class="card-box">
  <button id="reportClose" class="card-x" aria-label="닫기">✕</button>
  <div class="card-name" id="reportTitle">신고하기</div>
  <div class="card-meta">사유를 골라주세요. 관리자가 확인해요.</div>
  <div class="opts report-reasons" id="reportReasons"></div>
  <textarea id="reportDetail" maxlength="500" rows="3" placeholder="자세한 내용 (선택)"></textarea>
  <button id="reportSend" class="btn go">신고 접수</button>
</div></div>
<div id="confirmBox" hidden><div class="card-box">
  <div class="card-name" id="confirmTitle"></div>
  <div class="card-meta" id="confirmMsg"></div>
  <div class="confirm-btns"><button type="button" class="btn ghost" id="confirmNo">취소</button><button type="button" class="btn go" id="confirmYes">확인</button></div>
</div></div>
<div id="chat" hidden><div class="chat-box">
  <div class="chat-head"><span id="chatName"></span><span class="chat-tools"><button type="button" id="chatReport" class="tool">신고</button><button type="button" id="chatBlock" class="tool">차단</button><button id="chatClose" aria-label="닫기">✕</button></span></div>
  <div class="chat-msgs" id="chatMsgs"></div>
  <form class="chat-input" id="chatForm"><input id="chatText" placeholder="메시지 입력" autocomplete="off" maxlength="200"><button type="submit">전송</button></form>
</div></div>
<div id="loading">마을을 불러오는 중…</div>

function makeBody(root,o){
  const clothes=new THREE.MeshStandardMaterial({ color:o.clothes, roughness:0.7 });
  const clothesD=new THREE.MeshStandardMaterial({ color:new THREE.Color(o.clothes).multiplyScalar(0.72), roughness:0.7 });
  const hairMat=new THREE.MeshStandardMaterial({ color:o.hairColor, roughness:0.75 });
  let legL, legR;
  if(o.gender==='female'){ const skirt=new THREE.Mesh(new THREE.ConeGeometry(0.46,0.5,18),clothes); skirt.position.y=0.66; root.add(skirt);
    legL=limb(-0.12,0.5,0.34,0.08,skinMat); root.add(legL); legR=limb(0.12,0.5,0.34,0.08,skinMat); root.add(legR); }
  else { legL=limb(-0.17,0.62,0.42,0.12,clothesD); root.add(legL); legR=limb(0.17,0.62,0.42,0.12,clothesD); root.add(legR); }
  const torso=new THREE.Mesh(new THREE.CapsuleGeometry(0.3,0.42,6,14),clothes); torso.position.y=1.0; root.add(torso);
  const armL=limb(-0.38,1.28,0.38,0.1,clothes); root.add(armL); const armR=limb(0.38,1.28,0.38,0.1,clothes); root.add(armR);
  for(const g of [armL,armR]){ const h=new THREE.Mesh(new THREE.SphereGeometry(0.1,10,8),skinMat); h.position.y=-0.52; g.add(h); }
  const HY=1.74; let head;
  if(o.face==='square') head=new THREE.Mesh(new THREE.BoxGeometry(0.62,0.6,0.6),skinMat);
  else if(o.face==='triangle'){ head=new THREE.Mesh(new THREE.ConeGeometry(0.46,0.72,4),skinMat); head.rotation.x=Math.PI; head.rotation.y=Math.PI/4; }
  else head=new THREE.Mesh(new THREE.SphereGeometry(0.37,20,16),skinMat);
  head.position.y=HY; root.add(head);
  const cap=new THREE.Mesh(new THREE.SphereGeometry(0.4,18,12,0,Math.PI*2,0,Math.PI*0.58),hairMat); cap.position.y=HY+0.06; root.add(cap);
  if(o.hair==='long') for(const sx of [-0.36,0.36]){ const s=new THREE.Mesh(new THREE.CapsuleGeometry(0.1,0.34,4,8),hairMat); s.position.set(sx,HY-0.12,-0.02); root.add(s); }
  if(o.hair==='spiky') for(let i=0;i<6;i++){ const s=new THREE.Mesh(new THREE.ConeGeometry(0.09,0.22,6),hairMat); const a=(i/6)*Math.PI*2; s.position.set(Math.cos(a)*0.2,HY+0.3,Math.sin(a)*0.2); s.rotation.z=-Math.cos(a)*0.4; s.rotation.x=Math.sin(a)*0.4; root.add(s); }
  for(const sx of [-0.14,0.14]){ const e=o.eye==='line'?new THREE.Mesh(new THREE.BoxGeometry(0.12,0.035,0.04),darkMat):new THREE.Mesh(new THREE.SphereGeometry(0.055,10,8),darkMat); e.position.set(sx,HY+0.02,0.34); root.add(e); }
  root.add(makeNickSprite(o.nick||'손님', o.gender));
  return { legL, legR, armL, armR };
}

const PLAZA_WS = 'wss://keylink-plaza.keylink-plaza-cf.workers.dev'; // Cloudflare Worker(실시간). 재배포하면 이 한 줄만.
const _wsBase = new URLSearchParams(location.search).get('ws')

const _wsQuery = new URLSearchParams(); if(_wsRoom) _wsQuery.set('room',_wsRoom); if(DEV_ID) _wsQuery.set('dev',DEV_ID);
const WS_URL = _wsBase ? (_wsBase.replace(/\/+$/,'') + '/ws' + (_wsQuery.toString() ? '?'+_wsQuery.toString() : '')) : '';
const peers=new Map(); // id -> { group, refs, target:{x,z,ry}, nick, phase, lastMove }
const blocked=new Set();    // 내가 차단한 사람의 익명 키(회원) — 서버에 저장돼 다음에도 유지
const blockedIds=new Set();  // 키가 없는 상대(손님)는 이번 접속 동안만 차단
let roomFullUntil=0, bannedUntil=0;
function showBanned(until, reason){ bannedUntil=until||Date.now()+86400000; chat.hidden=true; card.hidden=true;
  const forever=bannedUntil>8e15; const d=new Date(bannedUntil);
  const when=forever?'영구적으로':(d.getMonth()+1)+'월 '+d.getDate()+'일 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+'까지';
  let el=document.getElementById('bannedBox'); if(!el){ el=document.createElement('div'); el.id='bannedBox'; document.body.appendChild(el); }
  el.innerHTML='<div class="card-box"><div class="card-name">광장 이용이 제한됐어요</div><div class="card-meta">'+(reason==='reports'?'여러 회원의 신고가 접수돼 ':'운영 정책 위반으로 ')+when+' 입장할 수 없어요.</div></div>';
  el.hidden=false; }
let ws=null, myId=null;
const netDot=document.getElementById('netDot'), netTxt=document.getElementById('netTxt');
function setNet(on, n){ netDot.className='dot '+(on?'on':'off'); netTxt.textContent = on ? ('접속 '+(n)+'명') : '오프라인 (혼자)'; }
function addPeer(p){ if(p.id===myId||peers.has(p.id)) return; if((p.key && blocked.has(p.key)) || blockedIds.has(p.id)) return; /* 차단한 사람은 안 보임 */ const group=new THREE.Group(); const root=new THREE.Group(); group.add(root); const refs=makeBody(root, p.look||{clothes:'#5bb0d1',hairColor:'#6b4423',face:'round',hair:'short',eye:'round',nick:p.nick}); group.position.set(p.state?.x||0,0,p.state?.z||0); group.userData={ profile:{ nick:p.nick, id:p.id, key:p.key||null, gkey:p.gkey||null, gender:(p.look&&p.look.gender==='female')?'여':(p.look&&p.look.gender==='male')?'남':null } }; scene.add(group); peers.set(p.id,{ group, refs, root, key:p.key||null, target:{x:group.position.x,z:group.position.z,ry:0}, nick:p.nick, phase:Math.random()*10 }); updateCount(); }
function updateCount(){ setNet(true, peers.size+1); }
function connect(){
  if(!WS_URL){ setNet(false); return; } // 운영 실시간 서버 주소 미설정 → 혼자 모드(봇만)
  try{ ws=new WebSocket(WS_URL); }catch(e){ setNet(false); return; }
  ws.onopen=()=>{ ws.send(JSON.stringify({ t:'hello', room:'plaza', nick:opts.nick, look:opts, uid: myUid })); };
  ws.onclose=()=>{ setNet(false); for(const [id,pr] of peers){ scene.remove(pr.group); } peers.clear(); if(bannedUntil>Date.now()) return; const wait=Date.now()<roomFullUntil?30000:2500; setTimeout(()=>{ if(mode==='playing') connect(); }, wait); };
  ws.onerror=()=>{ setNet(false); };
  ws.onmessage=(ev)=>{ let m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
    if(m.t==='full'){ roomFullUntil=Date.now()+30000; toast('광장이 꽉 찼어요. 잠시 후 다시 연결할게요'); return; }
    if(m.t==='banned'){ showBanned(m.until, m.reason); return; }
    if(m.t==='welcome'){ myId=m.id; if(m.nick && m.nick!==opts.nick) document.getElementById('hudNick').textContent=m.nick+' 님'; (m.peers||[]).forEach(addPeer); updateCount(); }
    else if(m.t==='join'){ addPeer(m); }
    else if(m.t==='peer'){ const pr=peers.get(m.id); if(pr) pr.target={x:m.x,z:m.z,ry:m.ry}; }
    else if(m.t==='leave'){ const pr=peers.get(m.id); if(pr){ scene.remove(pr.group); peers.delete(m.id); updateCount(); } if(currentChat && !currentChat.bot && currentChat.id===m.id){ addMsg('sys', (currentChat.nick||'상대')+'님이 대화방을 나가셨습니다.'); } }
    else if(((m.key && blocked.has(m.key)) || blockedIds.has(m.from)) && (m.t==='req'||m.t==='accept'||m.t==='chat'||m.t==='chatbye')){ return; } // 차단한 사람
    else if(m.t==='req'){ showReq(m.from, m.nick, m.uid, m.key); }
    else if(m.t==='accept'){ toast(`💗 ${m.nick}님과 매칭!`); openChat({ id:m.from, nick:m.nick, uid:m.uid, key:m.key, bot:false }); }
    else if(m.t==='chat'){ onChatMsg(m.from, m.nick, m.text, m.uid); }
    else if(m.t==='chatbye'){ if(currentChat && !currentChat.bot && currentChat.id===m.from){ addMsg('sys', (currentChat.nick||'상대')+'님이 대화방을 나가셨습니다.'); currentChat.left=true; } }
  };
}

const raycaster=new THREE.Raycaster(); const ndc=new THREE.Vector2();
let dragId=null, dragX=0, dragY=0, dragged=false;
const canvasEl=renderer.domElement, reticle=document.getElementById('reticle');

const modalOpen=()=> !card.hidden || !chat.hidden || !joinBox.hidden;
function pickProfile(prof){ if(!prof) return; if(member) openCard(prof); else openJoin(()=>openCard(prof)); }
function raycastFromNDC(x,y){ ndc.set(x,y); raycaster.setFromCamera(ndc,camera); const groups=[...[...peers.values()].map(p=>p.group), ...bots]; const hits=raycaster.intersectObjects(groups,true); if(!hits.length) return null; let g=hits[0].object; while(g&&!g.userData.profile) g=g.parent; return g?g.userData.profile:null; }

// ── 데스크톱: 배그식 마우스룩(Pointer Lock) ──
canvasEl.addEventListener('pointerdown',(e)=>{
  if(e.pointerType==='mouse'){
    if(mode!=='playing'||modalOpen()) return;
    if(!locked){ try{ canvasEl.requestPointerLock(); }catch(_){} }   // 커서를 가둬 마우스룩 시작
    else if(aimTarget){ pickProfile(aimTarget); }                     // 조준점(가운데)에 있는 사람 선택
    return;
  }
  // 터치/펜: 드래그로 시야 회전 + 탭 선택
  if(mode!=='playing'||modalOpen()) return;
  dragId=e.pointerId; dragX=e.clientX; dragY=e.clientY; dragged=false;
});
document.addEventListener('pointerlockchange',()=>{ locked=(document.pointerLockElement===canvasEl); reticle.hidden=!locked; if(!locked){ reticle.classList.remove('on'); aimTarget=null; } });
// 마우스 이동량(movementX/Y)으로 카메라 회전 — 잠금 상태에서만
// 마우스 위로 → 위를 본다(FPS 관례). 올려다보면 카메라가 낮아지며 하늘을 향하므로 camPitch를 낮춘다 → movementY와 같은 부호.
addEventListener('mousemove',(e)=>{ if(!locked) return; const s=0.0022; camYaw-=e.movementX*s; camPitch=Math.min(camMaxPitch,Math.max(camMinPitch,camPitch+e.movementY*s)); });

addEventListener('pointermove',(e)=>{ if(e.pointerId!==dragId) return; const dx=e.clientX-dragX, dy=e.clientY-dragY; if(!dragged && Math.hypot(dx,dy)>6) dragged=true; if(dragged){ camYaw-=dx*0.005; camPitch=Math.min(camMaxPitch,Math.max(camMinPitch,camPitch-dy*0.005)); dragX=e.clientX; dragY=e.clientY; } });
addEventListener('pointerup',(e)=>{ if(e.pointerId!==dragId) return; const wasDrag=dragged; dragId=null;
  if(!wasDrag && mode==='playing' && !modalOpen()){ pickProfile(raycastFromNDC((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1)); } });
canvasEl.addEventListener('wheel',(e)=>{ camDist=Math.min(24,Math.max(7,camDist+Math.sign(e.deltaY)*1.3)); },{passive:true});

// ── 루프 ──
const clock=new THREE.Clock();
function tick(){
  const dt=Math.min(clock.getDelta(),0.05); const L=THREE.MathUtils.lerp;
  if(mode==='playing'){
    let ix=move.x, iy=move.y;
    if(keys['KeyA']||keys['ArrowLeft']) ix-=1; if(keys['KeyD']||keys['ArrowRight']) ix+=1;
    if(keys['KeyW']||keys['ArrowUp']) iy-=1; if(keys['KeyS']||keys['ArrowDown']) iy+=1;
    const len=Math.hypot(ix,iy);
    if(len>0.08){ ix/=Math.max(len,1); iy/=Math.max(len,1);
      const fwdX=-Math.sin(camYaw), fwdZ=-Math.cos(camYaw), rgtX=Math.cos(camYaw), rgtZ=-Math.sin(camYaw);
      let vx=ix*rgtX+(-iy)*fwdX, vz=ix*rgtZ+(-iy)*fwdZ; const vl=Math.hypot(vx,vz)||1; vx/=vl; vz/=vl;
      hero.position.x+=vx*7*dt; hero.position.z+=vz*7*dt;
      const r=Math.hypot(hero.position.x,hero.position.z); if(r>BOUNDARY){ hero.position.x*=BOUNDARY/r; hero.position.z*=BOUNDARY/r; }
      pushOut(hero);
      hero.rotation.y=Math.atan2(vx,vz); }
    if(rig.root){ const walking=len>0.08&&grounded; if(walking) walkPhase+=dt*9; const s=walking?Math.sin(walkPhase):0; rig.legL.rotation.x=L(rig.legL.rotation.x,s*0.55,0.3); rig.legR.rotation.x=L(rig.legR.rotation.x,-s*0.55,0.3); rig.armL.rotation.x=L(rig.armL.rotation.x,-s*0.5,0.3); rig.armR.rotation.x=L(rig.armR.rotation.x,s*0.5,0.3); rig.root.position.y=walking?Math.abs(Math.sin(walkPhase))*0.05:L(rig.root.position.y,0,0.2); }
    if((keys['Space']||mobileJump)&&grounded){ vy=8; grounded=false; } mobileJump=false; vy-=22*dt; hero.position.y+=vy*dt; if(hero.position.y<=0){ hero.position.y=0; vy=0; grounded=true; }
    const target=hero.position.clone().add(camOff()); camera.position.lerp(target,1-Math.pow(0.0008,dt)); camera.lookAt(hero.position.x,hero.position.y+1.4,hero.position.z);
    if(locked){ aimTarget=raycastFromNDC(0,0); reticle.classList.toggle('on', !!aimTarget); } // 화면 중앙 조준
    sendPos(dt);
  } else {
    const target=new THREE.Vector3(SPAWN.x,SPAWN.y+2.7,SPAWN.z+6.8); camera.position.lerp(target,1-Math.pow(0.004,dt)); camera.lookAt(SPAWN.x,SPAWN.y+1.2,SPAWN.z); hero.rotation.y=Math.sin(clock.elapsedTime*0.8)*0.5;
  }
  // 다른 접속자 보간 + 걷기
  for(const pr of peers.values()){
    const g=pr.group, before=g.position.x+g.position.z;
    g.position.x=L(g.position.x,pr.target.x,0.18); g.position.z=L(g.position.z,pr.target.z,0.18);
    const moved=Math.abs((g.position.x+g.position.z)-before);
    if(moved>0.002){ g.rotation.y=pr.target.ry; pr.phase+=dt*9; const s=Math.sin(pr.phase); pr.refs.legL.rotation.x=s*0.5; pr.refs.legR.rotation.x=-s*0.5; pr.refs.armL.rotation.x=-s*0.45; pr.refs.armR.rotation.x=s*0.45; pr.root.position.y=Math.abs(Math.sin(pr.phase))*0.045; }
    else { pr.refs.legL.rotation.x=L(pr.refs.legL.rotation.x,0,0.2); pr.refs.legR.rotation.x=L(pr.refs.legR.rotation.x,0,0.2); pr.refs.armL.rotation.x=L(pr.refs.armL.rotation.x,0,0.2); pr.refs.armR.rotation.x=L(pr.refs.armR.rotation.x,0,0.2); pr.root.position.y=L(pr.root.position.y,0,0.2); }
  }
  // 가상 이웃 돌아다니기
  for(const b of bots){ const u=b.userData;
    if(!u.target||b.position.distanceTo(u.target)<0.7){ const a=Math.random()*Math.PI*2, rad=3+Math.random()*14; u.target=new THREE.Vector3(Math.cos(a)*rad,0,Math.sin(a)*rad); }
    const dir=u.target.clone().sub(b.position); dir.y=0; const d=dir.length();
    if(d>0.1){ dir.normalize(); b.position.addScaledVector(dir,2.2*dt); pushOut(b); b.rotation.y=Math.atan2(dir.x,dir.z); u.phase+=dt*8; const s=Math.sin(u.phase); u.refs.legL.rotation.x=s*0.5; u.refs.legR.rotation.x=-s*0.5; u.refs.armL.rotation.x=-s*0.45; u.refs.armR.rotation.x=s*0.45; u.root.position.y=Math.abs(Math.sin(u.phase))*0.045; } }
  renderer.render(scene,camera); requestAnimationFrame(tick);
}
tick();
</script>
